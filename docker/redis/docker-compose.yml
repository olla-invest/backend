# 실행 방법
# docker-compose -f docker-compose.yml up -d
version: '3.4'

services:
    kiwoom-redis:
        image: redis/redis-stack:latest
        container_name: kiwoom-redis
        ports:
            - 6379:6379
            - 8001:8001
        restart: always
        volumes:
            - ./redis.conf:/usr/local/etc/redis/redis.conf
            - kiwoom-redis-data:/data
        command: redis-stack-server /usr/local/etc/redis/redis.conf
        networks:
            - kiwoom-network

volumes:
    kiwoom-redis-data:

networks:
    kiwoom-network:
        driver: bridge
