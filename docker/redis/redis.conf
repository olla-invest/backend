# Redis Configuration for Kiwoom Investment System

# Enable keyspace notifications for cache management
notify-keyspace-events KEA

# Allow connections from any IP (for development)
# WARNING: Change this in production
protected-mode no

# Redis password
requirepass kiwoom@redis2026

# Max memory policy (optional, uncomment if needed)
# maxmemory 256mb
# maxmemory-policy allkeys-lru

# Persistence (optional)
# save 900 1
# save 300 10
# save 60 10000

# Log level
loglevel notice
